spring:
  application:
    name: altairis-backoffice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/altairis}
    username: ${DB_USER:altairis}
    password: ${DB_PASSWORD:altairis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

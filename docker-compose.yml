services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: altairis_ops
      POSTGRES_USER: altairis_ops
      POSTGRES_PASSWORD: altairis_ops
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altairis_ops -d altairis_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/altairis_ops
      DB_USER: altairis_ops
      DB_PASSWORD: altairis_ops
      CORS_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Sano cuando Spring ha arrancado y Flyway ha migrado (actuator responde UP)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        # El frontend reenvía /api/* al backend por la red interna de Docker
        BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # No se sirve la web hasta que la API está lista: evita errores en la primera carga
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
